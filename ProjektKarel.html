<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProjectHub - Collaboration Marketplace</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* NAVBAR */
        nav {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h1 {
            color: #667eea;
            font-size: 24px;
        }

        nav .buttons {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-small {
            padding: 8px 12px;
            font-size: 12px;
        }

        .btn-upvote {
            background: #f0f0f0;
            color: #667eea;
            border: 1px solid #667eea;
            padding: 5px 10px;
            font-size: 12px;
        }

        .btn-upvote:hover {
            background: #667eea;
            color: white;
        }

        /* MODALS */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .modal-content h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: inherit;
            font-size: 14px;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-buttons button {
            flex: 1;
        }

        .close-btn {
            background: #f0f0f0;
            color: #333;
        }

        /* FILTERS */
        .filters {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .filters select {
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background: white;
            cursor: pointer;
            font-size: 14px;
        }

        /* PROJECTS GRID */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .project-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: all 0.3s;
            border-left: 5px solid #667eea;
        }

        .project-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .project-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 10px;
        }

        .project-card h3 {
            color: #333;
            margin-bottom: 5px;
        }

        .project-category {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .project-difficulty {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            margin-left: 5px;
        }

        .difficulty-easy {
            background: #d4edda;
            color: #155724;
        }

        .difficulty-medium {
            background: #fff3cd;
            color: #856404;
        }

        .difficulty-hard {
            background: #f8d7da;
            color: #721c24;
        }

        .project-card p {
            color: #666;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .project-needs {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .project-needs strong {
            display: block;
            margin-bottom: 5px;
            color: #333;
        }

        .needs-list {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .need-tag {
            background: #e7f3ff;
            color: #0066cc;
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 12px;
        }

        .project-author {
            color: #999;
            font-size: 12px;
            margin-bottom: 10px;
        }

        .project-stats {
            display: flex;
            gap: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            color: #666;
            font-size: 13px;
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* DETAIL VIEW */
        .detail-view {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .detail-header {
            border-bottom: 2px solid #eee;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        .detail-header h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .detail-meta {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            color: #666;
            font-size: 14px;
        }

        .ideas-section {
            margin-top: 30px;
        }

        .ideas-section h3 {
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .idea-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }

        .idea-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 10px;
        }

        .idea-title {
            font-weight: 600;
            color: #333;
        }

        .idea-upvotes {
            background: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 13px;
            color: #667eea;
            font-weight: 600;
        }

        .idea-description {
            color: #666;
            margin-bottom: 10px;
        }

        .idea-author {
            color: #999;
            font-size: 12px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            nav {
                flex-direction: column;
                gap: 15px;
            }

            .projects-grid {
                grid-template-columns: 1fr;
            }

            .filters {
                flex-direction: column;
            }

            .filters select {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- NAVBAR -->
    <nav>
        <h1>🚀 ProjectHub</h1>
        <div class="buttons">
            <button class="btn-secondary btn-small" onclick="showView('browse')">Browse</button>
            <button class="btn-primary btn-small" onclick="openAddProjectModal()">+ Nový projekt</button>
        </div>
    </nav>

    <!-- BROWSE VIEW -->
    <div id="browseView" class="view">
        <!-- FILTERS -->
        <div class="filters">
            <select id="categoryFilter" onchange="filterProjects()">
                <option value="">Všechny kategorie</option>
                <option value="programming">👨‍💻 Programování</option>
                <option value="design">🎨 Design</option>
                <option value="marketing">📱 Marketing</option>
                <option value="writing">✍️ Psaní</option>
                <option value="music">🎵 Hudba</option>
            </select>

            <select id="difficultyFilter" onchange="filterProjects()">
                <option value="">Všechny úrovně</option>
                <option value="easy">Začátečník</option>
                <option value="medium">Střední</option>
                <option value="hard">Pokročilý</option>
            </select>
        </div>

        <!-- PROJECTS GRID -->
        <div class="projects-grid" id="projectsGrid">
            <!-- Dynamicky vygenerováno -->
        </div>
    </div>

    <!-- DETAIL VIEW -->
    <div id="detailView" class="view" style="display: none;">
        <!-- Dynamicky vygenerováno -->
    </div>
</div>

<!-- MODAL: PŘIDAT PROJEKT -->
<div id="addProjectModal" class="modal">
    <div class="modal-content">
        <h2>➕ Nový projekt</h2>
        <form onsubmit="addProject(event)">
            <div class="form-group">
                <label>Název projektu</label>
                <input type="text" id="projectName" required>
            </div>

            <div class="form-group">
                <label>Popis</label>
                <textarea id="projectDesc" required></textarea>
            </div>

            <div class="form-group">
                <label>Kategorie</label>
                <select id="projectCategory" required>
                    <option value="">Vyber kategorii</option>
                    <option value="programming">👨‍💻 Programování</option>
                    <option value="design">🎨 Design</option>
                    <option value="marketing">📱 Marketing</option>
                    <option value="writing">✍️ Psaní</option>
                    <option value="music">🎵 Hudba</option>
                </select>
            </div>

            <div class="form-group">
                <label>Úroveň obtížnosti</label>
                <select id="projectDifficulty" required>
                    <option value="easy">Začátečník</option>
                    <option value="medium">Střední</option>
                    <option value="hard">Pokročilý</option>
                </select>
            </div>

            <div class="form-group">
                <label>Potřebujeme help s (odděleno čárkami)</label>
                <input type="text" id="projectNeeds" placeholder="React, UI Design, Copy writing..." required>
            </div>

            <div class="form-group">
                <label>Tvé jméno</label>
                <input type="text" id="projectAuthor" required>
            </div>

            <div class="form-group">
                <label>Email/Kontakt</label>
                <input type="email" id="projectContact" required>
            </div>

            <div class="modal-buttons">
                <button type="button" class="btn-secondary close-btn" onclick="closeModal('addProjectModal')">Zrušit</button>
                <button type="submit" class="btn-primary">Vytvořit projekt</button>
            </div>
        </form>
    </div>
</div>

<!-- MODAL: PŘIDAT NÁPADY -->
<div id="addIdeaModal" class="modal">
    <div class="modal-content">
        <h2>💡 Přidej svůj nápady</h2>
        <form onsubmit="addIdea(event)">
            <div class="form-group">
                <label>Název nápady</label>
                <input type="text" id="ideaTitle" required>
            </div>

            <div class="form-group">
                <label>Popis</label>
                <textarea id="ideaDesc" required></textarea>
            </div>

            <div class="form-group">
                <label>Tvé jméno</label>
                <input type="text" id="ideaAuthor" required>
            </div>

            <div class="modal-buttons">
                <button type="button" class="btn-secondary close-btn" onclick="closeModal('addIdeaModal')">Zrušit</button>
                <button type="submit" class="btn-primary">Přidat nápady</button>
            </div>
        </form>
    </div>
</div>

<script>
    // ============= DATA =============
    let projects = [];
    let currentProjectId = null;

    // Load data from localStorage
    function loadData() {
        const saved = localStorage.getItem('projectHubData');
        if (saved) {
            projects = JSON.parse(saved);
        } else {
            // Demo data
            projects = [
                {
                    id: 1,
                    name: "Chat App",
                    description: "Chci vytvořit jednoduchou chat aplikaci s real-time zprávami. Ideálně s React frontendem.",
                    category: "programming",
                    difficulty: "medium",
                    needs: ["React Developer", "UI Designer", "Backend API"],
                    author: "Pavel",
                    contact: "pavel@example.com",
                    createdAt: new Date().toLocaleDateString('cs-CZ'),
                    ideas: [
                        { id: 1, title: "Přidat dark mode", desc: "Implementovat tmavý motiv", author: "Jana", upvotes: 42 },
                        { id: 2, title: "Emoji supporta", desc: "Přidat možnost psát emoji", author: "Petr", upvotes: 28 }
                    ]
                },
                {
                    id: 2,
                    name: "Portfolio Website",
                    description: "Hledám designéra na vytvoření vizuálně atraktivního portfolia.",
                    category: "design",
                    difficulty: "easy",
                    needs: ["UI/UX Designer", "Frontend Developer"],
                    author: "Markéta",
                    contact: "marketa@example.com",
                    createdAt: new Date().toLocaleDateString('cs-CZ'),
                    ideas: [
                        { id: 1, title: "Animované najetí", desc: "Přidat smooth animace", author: "Michal", upvotes: 15 }
                    ]
                },
                {
                    id: 3,
                    name: "Blog na Hugovi",
                    description: "Pomáhejte mi s psaním articles o web developmentu a SEO optimalizací.",
                    category: "writing",
                    difficulty: "easy",
                    needs: ["Copywriter", "SEO Expert", "Content Manager"],
                    author: "Tomáš",
                    contact: "tomas@example.com",
                    createdAt: new Date().toLocaleDateString('cs-CZ'),
                    ideas: []
                }
            ];
            saveData();
        }
    }

    function saveData() {
        localStorage.setItem('projectHubData', JSON.stringify(projects));
    }

    // ============= UI =============
    function renderProjects() {
        const grid = document.getElementById('projectsGrid');
        const categoryFilter = document.getElementById('categoryFilter').value;
        const difficultyFilter = document.getElementById('difficultyFilter').value;

        let filtered = projects;

        if (categoryFilter) {
            filtered = filtered.filter(p => p.category === categoryFilter);
        }

        if (difficultyFilter) {
            filtered = filtered.filter(p => p.difficulty === difficultyFilter);
        }

        if (filtered.length === 0) {
            grid.innerHTML = '<div class="empty-state"><p>Žádné projekty nenalezeny 😢</p></div>';
            return;
        }

        grid.innerHTML = filtered.map(project => `
            <div class="project-card" onclick="showProjectDetail(${project.id})">
                <div class="project-header">
                    <div>
                        <h3>${project.name}</h3>
                        <div>
                            <span class="project-category">${getCategoryEmoji(project.category)} ${getCategoryName(project.category)}</span>
                            <span class="project-difficulty difficulty-${project.difficulty}">${getDifficultyName(project.difficulty)}</span>
                        </div>
                    </div>
                </div>
                <p>${project.description.substring(0, 100)}...</p>
                <div class="project-needs">
                    <strong>Potřebujeme:</strong>
                    <div class="needs-list">
                        ${project.needs.map(n => `<span class="need-tag">${n}</span>`).join('')}
                    </div>
                </div>
                <div class="project-author">👤 ${project.author}</div>
                <div class="project-stats">
                    <div class="stat">💡 ${project.ideas.length} nápadů</div>
                </div>
            </div>
        `).join('');
    }

    function showProjectDetail(projectId) {
        currentProjectId = projectId;
        const project = projects.find(p => p.id === projectId);
        const detailView = document.getElementById('detailView');

        detailView.innerHTML = `
            <button class="btn-secondary" style="margin-bottom: 20px;" onclick="showView('browse')">← Zpět</button>
            <div class="detail-view">
                <div class="detail-header">
                    <h1>${project.name}</h1>
                    <div class="detail-meta">
                        <span>${getCategoryEmoji(project.category)} ${getCategoryName(project.category)}</span>
                        <span>👤 ${project.author}</span>
                        <span>📧 ${project.contact}</span>
                        <span>📅 ${project.createdAt}</span>
                    </div>
                </div>

                <h2>Popis</h2>
                <p>${project.description}</p>

                <h2 style="margin-top: 20px;">Hledáme help s:</h2>
                <div class="needs-list">
                    ${project.needs.map(n => `<span class="need-tag">${n}</span>`).join('')}
                </div>

                <div class="ideas-section">
                    <h3>💡 Nápady od komunity (${project.ideas.length})</h3>
                    
                    ${project.ideas.length === 0 ? `
                        <div class="empty-state">
                            <p>Zatím žádné nápady... Buď první! ✨</p>
                        </div>
                    ` : `
                        ${project.ideas
                            .sort((a, b) => b.upvotes - a.upvotes)
                            .map(idea => `
                            <div class="idea-item">
                                <div class="idea-header">
                                    <div>
                                        <div class="idea-title">${idea.title}</div>
                                        <div class="idea-description">${idea.desc}</div>
                                        <div class="idea-author">💬 ${idea.author}</div>
                                    </div>
                                    <button class="btn-upvote" onclick="upvoteIdea(${project.id}, ${idea.id})">⬆️ ${idea.upvotes}</button>
                                </div>
                            </div>
                        `).join('')}
                    `}
                    
                    <button class="btn-primary" style="margin-top: 15px; width: 100%;" onclick="openAddIdeaModal(${project.id})">+ Přidej svůj nápady</button>
                </div>
            </div>
        `;

        showView('detail');
    }

    function showView(viewName) {
        document.getElementById('browseView').style.display = viewName === 'browse' ? 'block' : 'none';
        document.getElementById('detailView').style.display = viewName === 'detail' ? 'block' : 'none';
        if (viewName === 'browse') renderProjects();
    }

    function filterProjects() {
        renderProjects();
    }

    // ============= MODALS =============
    function openAddProjectModal() {
        document.getElementById('addProjectModal').classList.add('active');
    }

    function openAddIdeaModal(projectId) {
        currentProjectId = projectId;
        document.getElementById('addIdeaModal').classList.add('active');
    }

    function closeModal(modalId) {
        document.getElementById(modalId).classList.remove('active');
    }

    // ============= ACTIONS =============
    function addProject(e) {
        e.preventDefault();

        const newProject = {
            id: Math.max(...projects.map(p => p.id), 0) + 1,
            name: document.getElementById('projectName').value,
            description: document.getElementById('projectDesc').value,
            category: document.getElementById('projectCategory').value,
            difficulty: document.getElementById('projectDifficulty').value,
            needs: document.getElementById('projectNeeds').value.split(',').map(n => n.trim()),
            author: document.getElementById('projectAuthor').value,
            contact: document.getElementById('projectContact').value,
            createdAt: new Date().toLocaleDateString('cs-CZ'),
            ideas: []
        };

        projects.push(newProject);
        saveData();
        closeModal('addProjectModal');
        document.querySelector('form').reset();
        renderProjects();
        alert('✅ Projekt vytvořen!');
    }

    function addIdea(e) {
        e.preventDefault();

        const project = projects.find(p => p.id === currentProjectId);
        if (!project) return;

        const newIdea = {
            id: Math.max(...project.ideas.map(i => i.id), 0) + 1,
            title: document.getElementById('ideaTitle').value,
            desc: document.getElementById('ideaDesc').value,
            author: document.getElementById('ideaAuthor').value,
            upvotes: 0
        };

        project.ideas.push(newIdea);
        saveData();
        closeModal('addIdeaModal');
        document.querySelectorAll('#addIdeaModal input, #addIdeaModal textarea').forEach(el => el.value = '');
        showProjectDetail(currentProjectId);
        alert('✅ Nápady přidán!');
    }

    function upvoteIdea(projectId, ideaId) {
        const project = projects.find(p => p.id === projectId);
        if (!project) return;
        
        const idea = project.ideas.find(i => i.id === ideaId);
        if (!idea) return;
        
        idea.upvotes++;
        saveData();
        showProjectDetail(projectId);
    }

    // ============= HELPERS =============
    function getCategoryEmoji(category) {
        const emojis = {
            programming: '👨‍💻',
            design: '🎨',
            marketing: '📱',
            writing: '✍️',
            music: '🎵'
        };
        return emojis[category] || '📁';
    }

    function getCategoryName(category) {
        const names = {
            programming: 'Programování',
            design: 'Design',
            marketing: 'Marketing',
            writing: 'Psaní',
            music: 'Hudba'
        };
        return names[category] || 'Ostatní';
    }

    function getDifficultyName(difficulty) {
        const names = {
            easy: 'Začátečník',
            medium: 'Střední',
            hard: 'Pokročilý'
        };
        return names[difficulty] || 'Neznámé';
    }

    // ============= INIT =============
    loadData();
    renderProjects();
</script>

</body>
</html>
